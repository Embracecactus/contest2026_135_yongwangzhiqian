# SPDX-License-Identifier: Apache-2.0
# One-time, hash-bound publication of reviewed compiler/runtime fixes.
name: Finalize reviewed Shaniu fixes
on:
  push:
    branches: [dev-ai-contest-2026]
    paths:
      - '.github/workflows/shaniu-finalize-reviewed.yml'
      - '.github/shaniu-reviewed-fix.b64'
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Embracecactus/contest2026_135_yongwangzhiqian' && github.ref == 'refs/heads/dev-ai-contest-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and apply exact reviewed replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, json, pathlib, subprocess
          BASE = 'f0aaaeeadeeb719ab116b2a5b9b02f07f8d131c0'
          TARGET = 'b8b769a3f14eccf3a16716b3915e4905f20af7a9'
          own = '.github/workflows/shaniu-finalize-reviewed.yml'
          payload = '.github/shaniu-reviewed-fix.b64'
          checks = '.github/workflows/shaniu-source-checks.yml'
          allowed = {checks, 'app/bk7258/CMakeLists.txt', 'app/bk7258/bk7258_agent_product.c', 'app/bk7258/bk7258_display_service.c', 'docs/platforms/bk7258/shaniu-firstboot-candidate.md'}
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD^') != BASE or set(git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines()) != {own, payload}:
              raise SystemExit('Unexpected baseline or publication paths')
          packed = base64.b64decode(pathlib.Path(payload).read_text(), validate=True)
          if len(packed) != 2737 or hashlib.sha256(packed).hexdigest() != '13ebecf96964a5f148027a2e6f364dd9b6f1daef96861f5793b8202ea33fb4e0':
              raise SystemExit('Encoded replacement digest mismatch')
          raw = bz2.decompress(packed)
          if len(raw) > 32000 or hashlib.sha256(raw).hexdigest() != '037b48467f87e754847e3aa64a416dea012cabfaf2540813d3171fc3302c8b17':
              raise SystemExit('Decoded replacement digest mismatch')
          replacements = json.loads(raw)
          if len(replacements) != 5 or {r[0] for r in replacements} != allowed:
              raise SystemExit('Invalid source scope')
          for name, old_sha, new_sha, edits in replacements:
              p = pathlib.Path(name)
              if p.is_symlink() or not p.resolve().is_relative_to(pathlib.Path.cwd()):
                  raise SystemExit('Invalid source path')
              old = p.read_bytes()
              if hashlib.sha256(old).hexdigest() != old_sha:
                  raise SystemExit('Source changed: ' + name)
              lines = old.decode().splitlines(keepends=True)
              end = 0
              for first, last, text in edits:
                  if not (isinstance(first, int) and isinstance(last, int) and end <= first <= last <= len(lines) and isinstance(text, str)):
                      raise SystemExit('Invalid source replacement')
                  end = last
              for first, last, text in reversed(edits):
                  lines[first:last] = [text]
              new = ''.join(lines).encode()
              if hashlib.sha256(new).hexdigest() != new_sha:
                  raise SystemExit('Replacement mismatch: ' + name)
              p.write_bytes(new)
          own_bytes = pathlib.Path(own).read_bytes()
          pathlib.Path(own).unlink()
          pathlib.Path(payload).unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          if git('write-tree') != TARGET:
              raise SystemExit('Complete reviewed tree mismatch')
          # Native GitHub connection finalizes workflow changes separately.
          pathlib.Path(own).write_bytes(own_bytes)
          pathlib.Path(checks).write_bytes(subprocess.check_output(['git', 'show', BASE + ':' + checks]))
          subprocess.run(['git', 'add', '-A'], check=True)
          if set(git('diff', '--cached', '--name-only').splitlines()) != (allowed - {checks}) | {payload}:
              raise SystemExit('Unexpected staged paths')
          print('Reviewed target tree verified:', TARGET)
          PY
      - name: Publish reviewed business sources without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'ChatGPT code integration'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix: fit native claim QR and preserve shutdown completion events' -m 'Correct actual CMake assertion quoting; record successful APK and host checks. Full target/hardware validation remains pending.'
          git push origin HEAD:refs/heads/dev-ai-contest-2026
