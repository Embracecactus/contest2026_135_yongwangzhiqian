# SPDX-License-Identifier: Apache-2.0
name: Shaniu cold delivery

on:
  push:
    branches: [dev-ai-contest-2026]
    paths:
      - '.github/workflows/shaniu-source-checks.yml'
      - 'app/bk7258/**'
      - 'boards/bk7258/**'
      - 'chips/bk7258/**'
      - 'frameworks/**'
      - 'android/shaniu-companion/**'
      - 'tools/bk7258/**'
      - 'contest2026_135_yongwangzhiqian.xml'
      - 'openvela.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaniu-cold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
    steps:
      - name: Install the manifest client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y repo

      - name: Create a clean manifest-pinned workspace
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cold="$RUNNER_TEMP/shaniu-cold"
          mkdir -p "$cold"
          cd "$cold"
          repo init -u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            -b dev-ai-contest-2026 -m contest2026_135_yongwangzhiqian.xml \
            -g default,bk7258-sdk,platform-linux
          repo sync -j4 \
            apps apps/audioutils/speexdsp/speexdsp \
            apps/boot/mcuboot/mcuboot apps/crypto/mbedtls/mbedtls \
            apps/graphics/lvgl/lvgl apps/math/gemmlowp/gemmlowp \
            apps/math/kissfft/kissfft apps/math/ruy/ruy \
            apps/mlearning/cmsis-nn/cmsis-nn \
            apps/mlearning/tflite-micro/tflite-micro \
            apps/netutils/cjson/cJSON apps/netutils/mqttc/MQTT-C \
            apps/system/flatbuffers/flatbuffers build external \
            external/ffmpeg/ffmpeg external/unqlite/unqlite \
            contest2026_135_yongwangzhiqian \
            frameworks frameworks/connectivity \
            frameworks/connectivity/bluetooth frameworks/multimedia \
            frameworks/multimedia/media frameworks/multimedia/media/pfw \
            frameworks/system frameworks/system/topics \
            frameworks/system/utils frameworks/system/vibrator \
            nuttx nuttx/fs/fatfs/fatfs \
            nuttx/fs/littlefs/littlefs nuttx/openamp/libmetal \
            nuttx/openamp/open-amp packages packages/ai_agent \
            prebuilts/build-tools/linux-x86_64 prebuilts/cmake/linux-x86_64 \
            prebuilts/tools vendor vendor/beken \
            vendor/beken/bk_avdk_smp
          project="$cold/contest2026_135_yongwangzhiqian"
          test "$(git -C "$project" rev-parse HEAD)" = "$GITHUB_SHA"
          # -r resolves every manifest project, including unselected projects
          # that do not exist in this bounded AIDK checkout.
          repo manifest -o "$RUNNER_TEMP/declared-manifest.xml"
          printf 'checkout_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Build the locked toolchain and SDK inputs
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/shaniu-cold/contest2026_135_yongwangzhiqian"
          cd "$project"
          python3 -m venv "$RUNNER_TEMP/shaniu-python"
          echo "$RUNNER_TEMP/shaniu-python/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/shaniu-python/bin:$PATH"
          python3 -m pip install --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            -r tools/bk7258/sdk-python-requirements.txt
          python3 tools/bk7258/bk7258.py toolchain install
          python3 tools/bk7258/bk7258.py toolchain verify
          python3 tools/bk7258/bk7258.py sdk rebuild --profile cp-aidk \
            --source ../vendor/beken/bk_avdk_smp --jobs 4
          python3 tools/bk7258/bk7258.py sdk rebuild --profile ap-aidk \
            --source ../vendor/beken/bk_avdk_smp --jobs 4
          python3 tools/bk7258/bk7258.py sdk verify --profile cp-aidk
          python3 tools/bk7258/bk7258.py sdk verify --profile ap-aidk

      - name: Build signed BL1 BL2 CP and AP with an ephemeral development identity
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/shaniu-identity
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/shaniu-cold/contest2026_135_yongwangzhiqian"
          cd "$project"
          python3 tools/bk7258/bk7258.py identity init --development
          python3 tools/bk7258/bk7258.py identity init --development \
            | grep -F 'state=reused mode=development'
          python3 tools/bk7258/bk7258.py build --board aidk_ai_toy --boot mcuboot \
            --development-identity --rollback-floor 1 --jobs 4
          build_manifest=$(find "$RUNNER_TEMP/shaniu-cold/out/bk7258/aidk_ai_toy" \
            -path '*/releases/mcuboot/build-manifest.json' -type f -print -quit)
          test -n "$build_manifest"
          release="$RUNNER_TEMP/shaniu-release"
          python3 tools/bk7258/bk7258.py release full --build-manifest "$build_manifest" \
            --development-identity --version "0.6.0+1" \
            --product shaniu --artifact-id "ci-${GITHUB_RUN_ID}" --factory-init \
            --output-dir "$release"
          package=$(find "$release/package" -name '*.bkpack' -type f -print -quit)
          test -n "$package"
          python3 tools/bk7258/bk7258.py verify package --package "$package"
          python3 tools/bk7258/bk7258.py verify trust --package "$package" --openssl /usr/bin/openssl

      - name: Build the Android companion and existing unit tests
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP/shaniu-cold/contest2026_135_yongwangzhiqian/android/shaniu-companion"
          bash gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Run existing firmware and provisioning regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/shaniu-cold/contest2026_135_yongwangzhiqian"
          python3 tests/host/bk7258/test_bk7258_build_workspace.py
          python3 tests/host/bk7258/test_bk7258_package_delivery.py
          SHANIU_ANDROID_INTEROP=1 make -C tests/host/bk7258 run-product-keys run-provision

      - name: Stage public delivery evidence without the development private key
        shell: bash
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/shaniu-delivery"
          project="$RUNNER_TEMP/shaniu-cold/contest2026_135_yongwangzhiqian"
          mkdir -p "$delivery/firmware" "$delivery/android"
          cp -a "$RUNNER_TEMP/shaniu-release/." "$delivery/firmware/"
          cp "$RUNNER_TEMP/declared-manifest.xml" "$delivery/declared-manifest.xml"
          git -C "$project" rev-parse HEAD > "$delivery/source-commit.txt"
          cp "$project/android/shaniu-companion/app/build/outputs/apk/debug/"*.apk "$delivery/android/"
          ! find "$delivery" -type f \( -name '*.pem' -o -name '*private*' -o -name '*identity*' \) -print -quit | grep -q .
          (cd "$delivery" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shaniu-cold-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/shaniu-delivery/
          retention-days: 7
          if-no-files-found: error

  verify-delivery:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.build.outputs.checkout_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shaniu-cold-delivery-${{ github.sha }}
          path: delivery
      - name: Independently verify the downloaded factory software and APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat delivery/source-commit.txt)" = "$GITHUB_SHA"
          (cd delivery && sha256sum -c SHA256SUMS.txt)
          test -s delivery/declared-manifest.xml
          test "$(find delivery/android -name '*.apk' -type f | wc -l)" -ge 1
          package=$(find delivery/firmware/package -name '*.bkpack' -type f -print -quit)
          test -n "$package"
          python3 tools/bk7258/bk7258.py verify package --package "$package"
          python3 tools/bk7258/bk7258.py verify trust --package "$package" --openssl /usr/bin/openssl
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(next(Path('delivery/firmware').rglob('release.json')).read_text())
          build = json.loads((Path('delivery/firmware') / release['build_manifest']['path']).read_text())
          assert release['mode'] == 'full'
          assert release['signing_profile']['mode'] == 'development'
          assert release['materialization']['status'] == 'same-device-hardware-data-required'
          assert 'factory_software' in release
          assert 'factory_operator' not in release
          assert build['provenance']['source_commit'] == __import__('os').environ['GITHUB_SHA']
          assert build['layout']['identity'] == release['layout']['identity']
          assert build['layout']['sha256'] == release['layout']['sha256']
          assert build['target'] == release['target']
          assert build['trust']['bl1_public_fingerprint'] == release['security']['bl1_public_fingerprint']
          assert build['trust']['mcuboot_public_fingerprint'] == release['security']['mcuboot_public_fingerprint']
          print('factory software release: PASS (no board-specific full BIN)')
          PY
