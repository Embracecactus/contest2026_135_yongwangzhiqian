# SPDX-License-Identifier: Apache-2.0
name: Shaniu source checks

on:
  push:
    branches: [dev-ai-contest-2026]
    paths:
      - '.github/workflows/shaniu-source-checks.yml'
      - 'app/bk7258/**'
      - 'boards/bk7258/**'
      - 'chips/bk7258/**'
      - 'android/shaniu-companion/**'
      - 'tools/bk7258/**'
      - 'contest2026_135_yongwangzhiqian.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaniu-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    if: github.repository == 'Embracecactus/contest2026_135_yongwangzhiqian'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare manifest-pinned host dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          projects = {p.attrib['path']: p.attrib for p in ET.parse(root / 'openvela.xml').findall('project')}
          selected = ['apps', 'apps/crypto/mbedtls/mbedtls', 'apps/netutils/cjson/cJSON', 'apps/graphics/lvgl/lvgl', 'nuttx']
          records = []
          for path in selected:
              p = projects[path]
              dest = root.parent / path
              dest.mkdir(parents=True, exist_ok=True)
              url = 'https://github.com/open-vela/' + p['name'] + '.git'
              subprocess.run(['git', 'init', '-q', str(dest)], check=True)
              subprocess.run(['git', '-C', str(dest), 'fetch', '--depth=1', url, p['revision']], check=True)
              subprocess.run(['git', '-C', str(dest), 'checkout', '-q', '--detach', 'FETCH_HEAD'], check=True)
              records.append({'path': path, 'repository': url, 'commit': p['revision']})
          manifest = ET.parse(root / 'contest2026_135_yongwangzhiqian.xml')
          agent = next(p for p in manifest.findall('extend-project') if p.attrib.get('path') == 'packages/ai_agent')
          dest = root.parent / 'packages/ai_agent'
          dest.mkdir(parents=True, exist_ok=True)
          url = 'https://github.com/Embracecactus/packages_ai_agent.git'
          subprocess.run(['git', 'init', '-q', str(dest)], check=True)
          subprocess.run(['git', '-C', str(dest), 'fetch', '--depth=1', url, agent.attrib['revision']], check=True)
          subprocess.run(['git', '-C', str(dest), 'checkout', '-q', '--detach', 'FETCH_HEAD'], check=True)
          records.append({'path': 'packages/ai_agent', 'repository': url, 'commit': agent.attrib['revision']})
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'host-dependency-commits.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
      - name: Check source and existing product-key regression
        run: |
          python3 -m compileall -q tools/bk7258
          python3 tools/bk7258/bk7258.py verify layers
          make -C tests/host/bk7258 run-product-keys
      - name: Run existing provisioning regression
        run: make -C tests/host/bk7258 run-provision
      - name: Capture exact source and host inputs for offline review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o "$RUNNER_TEMP/shaniu-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/shaniu-source-commit.txt"
          if test -f "$RUNNER_TEMP/host-dependency-commits.json"; then
            tar --exclude='.git' -czf "$RUNNER_TEMP/shaniu-host-inputs.tar.gz" -C "$(dirname "$GITHUB_WORKSPACE")" apps nuttx packages
          fi
          (cd "$RUNNER_TEMP" && sha256sum shaniu-source.tar.gz > shaniu-source-SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shaniu-host-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shaniu-source.tar.gz
            ${{ runner.temp }}/shaniu-source-commit.txt
            ${{ runner.temp }}/shaniu-source-SHA256SUMS.txt
            ${{ runner.temp }}/shaniu-host-inputs.tar.gz
            ${{ runner.temp }}/host-dependency-commits.json
          retention-days: 7
          if-no-files-found: error

  android:
    if: github.repository == 'Embracecactus/contest2026_135_yongwangzhiqian'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use runner JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Compile APK and run existing unit tests
        working-directory: android/shaniu-companion
        run: bash gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shaniu-android-${{ github.sha }}
          path: |
            android/shaniu-companion/app/build/outputs/apk/debug/*.apk
            android/shaniu-companion/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn
