<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傻妞 · 我在 — 图标预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#202b32;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1184px;margin:auto;padding:42px 48px 34px}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:28px}h1{font-size:38px;letter-spacing:-1px;margin:0;font-weight:650}header p{color:#6c7e7a;font-size:14px;margin:10px 0 0}.edition{font-size:12px;letter-spacing:2px;color:#6c7e7a}.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:20px}.panel{border:1px solid #e0e6de;border-radius:24px;background:#fffdf9;padding:28px}.large{min-height:364px;display:flex;align-items:center;justify-content:center;gap:36px}.hero-icon{--size:238px}.icon{position:relative;display:inline-block;flex-shrink:0;width:var(--size,64px);height:var(--size,64px);overflow:hidden;background:linear-gradient(#f0f6e8,#a6ccc2);border-radius:50%}.icon img{position:absolute;width:88.888889%;height:88.888889%;left:5.555556%;top:5.555556%;object-fit:contain}.square{border-radius:24%}.icon svg{position:absolute;width:150%;height:150%;left:-25%;top:-25%}.themed{background:#dce4ff;color:#354e7f}.wordmark{font-size:23px;font-weight:600;margin:0 0 14px}.line{font-size:16px;line-height:1.9;color:#63736f;margin:0}.wallpapers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wall{height:232px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(145deg,#e4e8df,#faf4e8)}.wall.dark{background:radial-gradient(at 20% 10%,#41556b,#111b29 70%);color:#f7f6f1}.wall .icon{--size:88px}.wall span{font-size:13px}.caption{font-size:12px;color:#6e7a75;margin:20px 0 0;line-height:1.7}.checks{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.checks .panel{padding:24px 28px}h2{font-size:14px;font-weight:500;color:#61756d;margin:0 0 22px}.sizes{display:flex;align-items:end;justify-content:space-between;gap:24px}.sample{text-align:center}.sample label{display:block;font-size:11px;color:#7b8781;margin-top:10px}.masks{display:flex;align-items:center;justify-content:space-around;height:122px}.masks .icon{--size:76px}footer{margin-top:24px;display:flex;justify-content:space-between;color:#7b8781;font-size:11px}button{border:1px solid #cbd8d0;border-radius:30px;background:none;padding:7px 14px;color:#4d665c;cursor:pointer}.controls{display:flex;gap:10px;align-items:center}@media(max-width:850px){main{padding:24px}.hero,.checks{grid-template-columns:1fr}.large{gap:20px}.hero-icon{--size:200px}header{align-items:start}.edition{display:none}}
</style>
<main>
<header><div><h1>傻妞 · 我在</h1><p>短发角色，温暖回应。为故事重新设计的陪伴形象。</p></div><div class="edition">LAUNCHER / 2026.11</div></header>
<section class="hero">
  <div class="panel large"><div class="icon hero-icon" data-portrait></div><div><p class="wordmark">新的她</p><p class="line">深蓝短发<br>暖杏肤色<br>海盐绿底色</p></div></div>
  <div class="panel"><div class="wallpapers"><div class="wall"><div class="icon" data-portrait></div><span>傻妞</span></div><div class="wall dark"><div class="icon" data-portrait></div><span>傻妞</span></div></div><p class="caption">图标颜色固定，明暗壁纸下保留同一个角色。这里是资源预览；实际桌面截图另存。</p></div>
</section>
<section class="checks">
  <div class="panel"><h2>实际像素尺寸</h2><div class="sizes"><div class="sample"><div class="icon" style="--size:48px" data-portrait></div><label>48 px</label></div><div class="sample"><div class="icon" style="--size:64px" data-portrait></div><label>64 px</label></div><div class="sample"><div class="icon" style="--size:96px" data-portrait></div><label>96 px</label></div><div class="sample"><div class="icon" style="--size:120px" data-portrait></div><label>120 px</label></div></div></div>
  <div class="panel"><h2>自适应裁切与系统主题</h2><div class="masks"><div class="sample"><div class="icon" data-portrait></div><label>圆形</label></div><div class="sample"><div class="icon square" data-portrait></div><label>圆角方形</label></div><div class="sample"><div class="icon themed" id="mono"><img style="width:150%;height:150%;left:-25%;top:-25%" src="monochrome-preview.svg" alt="短发角色单色主题" /></div><label>单色主题</label></div></div></div>
</section>
<footer><span>虚构角色 · 原始图像与提示词随工程保留</span><div class="controls"><span id="scale-label">64 dp 前景</span><button id="compare">检查更大构图</button></div></footer>
</main>
<script>
for(const el of document.querySelectorAll('[data-portrait]')){const img=new Image();img.src='../../app/src/main/res/drawable-nodpi/shaniu_launcher_response.webp';img.alt='傻妞短发陪伴角色';el.append(img)}
window.previewReady=(async()=>{await Promise.all([...document.images].map(i=>i.decode()));await document.fonts.ready;return true})();
let expanded=false;document.querySelector('#compare').onclick=()=>{expanded=!expanded;const percent=(expanded?68:64)/72*100;for(const image of document.querySelectorAll('[data-portrait] img')){image.style.width=image.style.height=percent+'%';image.style.left=image.style.top=(100-percent)/2+'%'}document.querySelector('#scale-label').textContent=(expanded?'68':'64')+' dp 前景';document.querySelector('#compare').textContent=expanded?'返回实际构图':'检查更大构图'};
</script>
</html>
