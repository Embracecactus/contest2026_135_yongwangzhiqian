<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#83A9B4" stroke-width="1.4"/></marker></defs><rect x="30" y="25" width="420" height="144" rx="9" fill="#E2EFF2"/><text x="54" y="68" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">自研 BL1</text><text x="54" y="109" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">源码化启动与前级交接</text><rect x="540" y="25" width="420" height="144" rx="9" fill="#E2EFF2"/><text x="564" y="68" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">MCUboot BL2</text><text x="564" y="109" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">签名校验与槽位选择</text><rect x="1050" y="25" width="420" height="144" rx="9" fill="#E2EFF2"/><text x="1074" y="68" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">CP + AP</text><text x="1074" y="109" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">成对启动与监督</text><path d="M450 98L538 98" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M960 98L1048 98" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="248" width="630" height="149" rx="9" fill="#F1F5F7"/><text x="54" y="291" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">App 供包与设备校验</text><text x="54" y="332" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">本地 HTTPS → 校验板型、布局、签名与计数</text><rect x="838" y="248" width="630" height="149" rx="9" fill="#F1F5F7"/><text x="862" y="291" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">写入非活动槽</text><text x="862" y="332" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">CP / AP 成对写入；完整性检查后重启</text><path d="M660 324L836 324" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="838" y="456" width="630" height="155" rx="9" fill="#F1F5F7"/><text x="862" y="499" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">trial 与健康确认</text><text x="862" y="540" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">generation / 核心健康 / supervisor</text><text x="862" y="573" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">满足条件再确认；否则回退</text><path d="M1153 397L1153 454" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="456" width="630" height="155" rx="9" fill="#F1F5F7"/><text x="54" y="499" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">读取设备最终状态</text><text x="54" y="540" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">版本 + counter + 活动槽 + pair=confirmed</text><text x="54" y="573" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">不以进度条 100% 替代设备端确认</text><path d="M838 533L662 533" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="685" width="1438" height="182" rx="9" fill="#F4F0EC"/><text x="54" y="728" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">必须区分两类证据</text><text x="54" y="769" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">634：用户发起的实际 App OTA，更新非活动应用槽。</text><text x="54" y="802" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">637 / 638：用户手动烧录的同板完整恢复镜像，不是新的 App OTA。</text><text x="54" y="835" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">8 MiB operator 含设备绑定数据，不公开、不跨板；通用首烧身份初始化仍待验证。</text></svg>