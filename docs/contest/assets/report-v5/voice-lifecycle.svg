<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1L8 5L0 9" fill="none" stroke="#83A9B4" stroke-width="1.4"/></marker></defs><rect x="30" y="28" width="570" height="146" rx="9" fill="#F1F5F7"/><text x="54" y="71" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">待机与本地唤醒</text><text x="54" y="112" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">16 kHz PCM → microfrontend → INT8 KWS</text><rect x="865" y="28" width="600" height="146" rx="9" fill="#F1F5F7"/><text x="889" y="71" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">应答与自动收音</text><text x="889" y="112" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">当前 AIDK 配置包含授权应答 PCM</text><text x="889" y="145" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">命中后进入同一个语音交互</text><path d="M600 98L863 98" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="710" y="76" font-size="23" fill="#60727D" font-weight="400" font-family="Noto Sans CJK SC">命中</text><rect x="865" y="230" width="600" height="157" rx="9" fill="#F1F5F7"/><text x="889" y="273" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">ASR 与 Agent 会话</text><text x="889" y="314" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">整段 ASR → Session 上下文</text><text x="889" y="347" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">LLM 生成回答，或请求已注册工具</text><path d="M1165 174L1165 228" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="230" width="570" height="157" rx="9" fill="#F1F5F7"/><text x="54" y="273" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">受控工具执行</text><text x="54" y="314" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">tool_guard → 状态 / 控制 / 相机</text><text x="54" y="347" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">只使用当次结果，不开放任意 Shell</text><path d="M865 295L603 295" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M600 341L863 341" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="699" y="279" font-size="22" fill="#60727D" font-weight="400" font-family="Noto Sans CJK SC">调用</text><text x="699" y="371" font-size="22" fill="#60727D" font-weight="400" font-family="Noto Sans CJK SC">结果</text><rect x="865" y="443" width="600" height="164" rx="9" fill="#F1F5F7"/><text x="889" y="486" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">流式 TTS 与播放</text><text x="889" y="527" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">SSE PCM 分块送入 Media</text><text x="889" y="560" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">等待真实播放排空，再归还资源</text><path d="M1165 387L1165 441" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="443" width="570" height="164" rx="9" fill="#F1F5F7"/><text x="54" y="486" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">免唤醒追问</text><text x="54" y="527" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">同一交互续收音、保留上下文</text><text x="54" y="560" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">不重复唤醒；本轮状态仍然有效</text><path d="M865 523L603 523" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M315 443V414H755V268H863" stroke="#83A9B4" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="676" width="1435" height="139" rx="9" fill="#E2EFF2"/><text x="54" y="719" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">可恢复错误与终止条件分别处理</text><text x="54" y="760" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">638：一次 ASR ret=-5 后 interaction 保留并续收音；后续请求成功。</text><text x="54" y="793" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">静音 / 退出满足终止条件 → 清理资源 → rearm → next=wake。</text><rect x="30" y="868" width="1435" height="111" rx="9" fill="#F1F5F7"/><text x="54" y="911" font-size="29" fill="#176C7D" font-weight="700" font-family="Noto Sans CJK SC">证据范围</text><text x="54" y="952" font-size="24" fill="#182B39" font-weight="400" font-family="Noto Sans CJK SC">638 回贴支持语音、追问和 rearm；不构成断网注入、多说话人或全外设验收。</text></svg>